services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chamados}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-chamados}
    ports:
      - "54329:5432"
    volumes:
      - chamados-pg:/var/lib/postgresql/data

volumes:
  chamados-pg:
